name: Reusable Low Priority Checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner OS'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  bundle-analysis:
    name: '[LOW] Bundle Size Analysis'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Analyze Bundle Size
        run: |
          yarn build
          echo "=== Bundle Analysis ==="
          for dir in packages/*/dist; do
            if [ -d "$dir" ]; then
              echo "$(basename $(dirname $dir)): $(du -sh $dir | cut -f1)"
            fi
          done

  unused-dependencies:
    name: '[LOW] Unused Dependencies'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install depcheck
        run: npm install -g depcheck

      - name: Check Unused Dependencies
        run: depcheck
        continue-on-error: true

  deprecated-apis:
    name: '[LOW] Deprecated APIs Check'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for Deprecated APIs
        run: |
          echo "Checking for deprecated React/RN APIs..."
          grep -r "componentWillMount\|componentWillReceiveProps\|UNSAFE_" packages/*/src || echo "No deprecated lifecycle methods found"

  code-metrics:
    name: '[LOW] Code Metrics'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Count Lines of Code
        run: |
          echo "=== Code Metrics ==="
          echo "TypeScript Files: $(find packages -name "*.ts" -o -name "*.tsx" | wc -l)"
          echo "Test Files: $(find packages -name "*.test.ts" -o -name "*.test.tsx" | wc -l)"
