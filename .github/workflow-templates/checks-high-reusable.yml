name: High CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'Node versions to test (JSON array, default: ["20.x"])'
        required: false
        type: string
        default: '["20.x"]'
      runs-on:
        description: 'Runner OS (ubuntu-latest, macos-latest, windows-latest)'
        required: false
        type: string
        default: 'ubuntu-latest'

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  typecheck:
    name: 'TypeScript Type Checking'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: yarn workspaces run tsc --noEmit

  lint:
    name: 'ESLint Code Quality'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

  format:
    name: 'Prettier Code Formatting'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check Formatting
        run: yarn format --check

  build:
    name: 'Build & Compile'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript
        run: yarn build

  test:
    name: 'Unit Tests'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Unit Tests
        run: yarn test

  security:
    name: 'Security Audit'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Security Audit
        run: yarn audit --audit-level moderate
        continue-on-error: true
