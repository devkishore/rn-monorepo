name: Reusable Medium Priority Checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner OS'
        required: false
        type: string
        default: 'ubuntu-latest'

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  coverage:
    name: '[MEDIUM] Test Coverage Analysis'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Tests with Coverage
        run: yarn test -- --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/*/coverage
          retention-days: 30
          if-no-files-found: ignore

  dependency-check:
    name: '[MEDIUM] Check Dependencies'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check for Outdated Packages
        run: yarn outdated || true

  performance:
    name: '[MEDIUM] Performance Check'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build and Measure Bundle Size
        run: |
          yarn build
          du -sh packages/*/dist

  documentation:
    name: '[MEDIUM] Documentation Check'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README Files
        run: |
          echo "Checking README files..."
          [ -f README.md ] && echo "✓ Root README.md exists" || echo "✗ Missing README.md"
          find packages -name "README.md" -type f | sed 's/^/✓ /'
