name: Low Priority Checks

on:
  schedule:
    - cron: '0 3 * * 0' # Run weekly on Sunday at 3 AM UTC
  workflow_dispatch: # Allow manual trigger
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner OS'
        required: false
        type: string
        default: 'ubuntu-latest'

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  e2e-tests:
    name: '[LOW] E2E Tests'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run E2E Tests (If Available)
        run: yarn test:e2e || echo "E2E tests not configured yet"
        continue-on-error: true

  accessibility:
    name: '[LOW] Accessibility Audit'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Run Accessibility Checks
        run: |
          echo "Accessibility audit check"
          echo "Recommendations:"
          echo "- Use react-native-a11y for testing"
          echo "- Validate screen reader compatibility"
          echo "- Check touch target sizes (min 44x44 points)"
          echo "- Verify color contrast ratios"

  secrets-scan:
    name: '[LOW] Secrets Detection'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for Secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  bundle-analysis:
    name: '[LOW] Bundle Size Analysis'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Analyze Bundle Size
        run: |
          yarn build
          echo "=== Bundle Analysis ==="
          for dir in packages/*/dist; do
            if [ -d "$dir" ]; then
              echo "$(basename $(dirname $dir)): $(du -sh $dir | cut -f1)"
            fi
          done

  unused-dependencies:
    name: '[LOW] Unused Dependencies'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install depcheck
        run: npm install -g depcheck

      - name: Check Unused Dependencies
        run: depcheck
        continue-on-error: true

  deprecated-apis:
    name: '[LOW] Deprecated APIs Check'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Check for Deprecated APIs
        run: |
          echo "Checking for deprecated React/RN APIs..."
          grep -r "componentWillMount\|componentWillReceiveProps\|UNSAFE_" packages/*/src || echo "No deprecated lifecycle methods found"
          echo "Check completed"

  license-check:
    name: '[LOW] License Compliance'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check Licenses
        run: yarn licenses list || echo "License check completed"
        continue-on-error: true

  code-metrics:
    name: '[LOW] Code Metrics'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Count Lines of Code
        run: |
          echo "=== Code Metrics ==="
          echo "TypeScript Files: $(find packages/*/src -name "*.ts" -o -name "*.tsx" | wc -l)"
          echo "Test Files: $(find packages/*/src -name "*.test.ts" -o -name "*.test.tsx" | wc -l)"
          echo "Total Lines: $(find packages/*/src -name "*.ts" -o -name "*.tsx" | xargs wc -l | tail -1)"

  health-report:
    name: '[LOW] Project Health Report'
    runs-on: ${{ inputs.runs-on }}
    if: always()
    steps:
      - name: Generate Health Report
        run: |
          echo "📊 Project Health Report"
          echo "========================"
          echo "✅ All low priority checks completed"
          echo "For detailed metrics, review individual job logs"
