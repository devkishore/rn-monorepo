name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      node-versions:
        description: "Node versions to test (default: single latest LTS for speed)"
        required: false
        type: string
        default: "['20.x']"
      test-command:
        description: "Command to run tests (leave empty for default)"
        required: false
        type: string
        default: ""

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - name: Set Node versions
        id: set-versions
        run: |
          if [ -z "${{ inputs.node-versions }}" ]; then
            echo "versions=['20.x']" >> $GITHUB_OUTPUT
          else
            echo "versions=${{ inputs.node-versions }}" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: yarn workspaces run tsc --noEmit

      - name: Run ESLint
        run: yarn lint

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        node-version: ${{ fromJson(needs.setup.outputs.node-versions) }}
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile

      - name: Type Check (TypeScript)
        run: yarn workspaces run tsc --noEmit

      - name: Build TypeScript
        run: yarn build

      - name: Run unit tests (ts-jest + coverage)
        run: ${{ inputs.test-command || 'yarn test' }}

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: packages/*/coverage
          retention-days: 7
          if-no-files-found: ignore
