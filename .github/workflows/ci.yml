name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  call-workflow:
    uses: ./.github/workflows/checks-high.yml
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
