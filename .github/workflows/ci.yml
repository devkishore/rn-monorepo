name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
    inputs:
      node-versions:
        description: "Node versions to test (default: single latest LTS for speed)"
        required: false
        type: string
        default: "['20.x']"
      test-command:
        description: "Command to run tests (leave empty for auto-detection)"
        required: false
        type: string
        default: ""

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.set-versions.outputs.versions }}
    steps:
      - name: Set Node versions
        id: set-versions
        run: echo "versions=${{ inputs.node-versions }}" >> $GITHUB_OUTPUT

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js (20.x)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        node-version: ${{ fromJson(needs.setup.outputs.node-versions) }}
      fail-fast: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Detect test command
        id: test-command
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            echo "command=${{ inputs.test-command }}" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"workspaces"' package.json; then
            echo "command=yarn workspaces run test" >> $GITHUB_OUTPUT
          else
            echo "command=yarn test" >> $GITHUB_OUTPUT
          fi

      - name: Run unit tests
        run: ${{ steps.test-command.outputs.command }}
